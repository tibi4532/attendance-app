<div id="attendance-app"></div>
<style>
  #attendance-app, #attendance-app * { box-sizing: border-box; }
  :root{
    --ink:#1c2b2d;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dfd9c9;
    --accent:#2f6f5e;
    --accent-deep:#1f4f42;
    --warn:#b5482f;
    --gold:#c8973a;
    --muted:#6b7573;
  }
  #attendance-app{
    font-family: "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .aa-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line);
  }
  .aa-brand{ display:flex; flex-direction:column; gap:2px; }
  .aa-brand .eyebrow{ font-size:12px; letter-spacing:.14em; color:var(--muted); }
  .aa-brand h1{ margin:0; font-size:22px; font-weight:700; }
  .aa-clock{ text-align:right; }
  .aa-clock .time{ font-size:34px; font-weight:700; font-variant-numeric: tabular-nums; color:var(--accent-deep); line-height:1; }
  .aa-clock .date{ font-size:13px; color:var(--muted); margin-top:4px; }

  .aa-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
    gap: 16px;
    padding: 24px 28px 100px;
  }
  .aa-tile{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 14px;
    text-align:center;
    cursor:pointer;
    min-height: 108px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .aa-tile:active{ transform: scale(.97); }
  .aa-tile .name{ font-size:18px; font-weight:700; }
  .aa-tile .status{ font-size:12px; padding:3px 10px; border-radius:100px; font-weight:600; }
  .aa-tile .status.out{ background:#eee9db; color:var(--muted); }
  .aa-tile .status.in{ background: rgba(47,111,94,.12); color: var(--accent-deep); }

  .aa-empty{ padding: 60px 20px; text-align:center; color:var(--muted); }
  .aa-empty button{ margin-top:14px; }

  .aa-fab{
    position: fixed; right: 22px; bottom: 22px;
    width: 52px; height:52px; border-radius:50%;
    background: var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer; color:var(--muted);
  }

  .aa-overlay{
    position: fixed; inset:0; background: rgba(28,43,45,.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .aa-modal{
    background: var(--card); border-radius:16px; padding:28px;
    width:100%; max-width:420px; max-height:86vh; overflow:auto;
  }
  .aa-modal.wide{ max-width:760px; }
  .aa-modal h2{ margin:0 0 4px; font-size:20px; }
  .aa-modal .sub{ color:var(--muted); font-size:13px; margin-bottom:18px; }
  .aa-btn{
    display:block; width:100%; padding:16px; border-radius:10px; border:none;
    font-size:17px; font-weight:700; cursor:pointer; margin-top:10px;
  }
  .aa-btn.primary{ background: var(--accent); color:#fff; }
  .aa-btn.primary.out{ background: var(--warn); }
  .aa-btn.ghost{ background: transparent; border:1px solid var(--line); color:var(--ink); }
  .aa-btn.small{ padding:10px 14px; font-size:14px; width:auto; display:inline-block; margin:6px 6px 0 0; }
  .aa-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .aa-row{ display:flex; gap:8px; align-items:center; }
  .aa-input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
    font-size:15px; background:#fbfaf6; margin-top:6px;
  }
  .aa-label{ font-size:12px; color:var(--muted); margin-top:14px; display:block; }

  .aa-tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .aa-tab{ padding:10px 14px; cursor:pointer; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; }
  .aa-tab.active{ color:var(--accent-deep); border-color:var(--accent-deep); font-weight:700; }

  .aa-list-item{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .aa-list-item .lbl{ font-weight:600; }

  table.aa-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.aa-table th, table.aa-table td{ padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  table.aa-table th{ color:var(--muted); font-weight:600; }
  .aa-del{ color:var(--warn); cursor:pointer; font-size:12px; }

  .aa-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background: var(--accent-deep); color:#fff; padding:14px 22px; border-radius:10px;
    font-size:15px; font-weight:600; z-index:80; box-shadow:0 8px 20px rgba(0,0,0,.2);
  }
  .aa-err{ color:var(--warn); font-size:13px; margin-top:8px; min-height:16px; }
  .aa-filterbar{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .aa-filterbar select{ padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#fbfaf6; }
</style>
<script>
(function(){
  const root = document.getElementById('attendance-app');
  const STORE = { employees: null, records: null, pin: '0000', pinLogs: [], admins: [] };
  let state = { modal: null, adminAuthed:false, adminTab:'employees', selectedEmployee:null, filterMonth:null, filterEmp:'all', currentAdminName:null };

  async function loadAll(){
    try{ const r = await window.storage.get('employees'); STORE.employees = r ? JSON.parse(r.value) : []; }catch(e){ STORE.employees = []; }
    try{ const r = await window.storage.get('records'); STORE.records = r ? JSON.parse(r.value) : []; }catch(e){ STORE.records = []; }
    try{ const r = await window.storage.get('settings'); STORE.pin = r ? JSON.parse(r.value).pin : '0000'; }catch(e){ STORE.pin = '0000'; }
    try{ const r = await window.storage.get('pinlogs'); STORE.pinLogs = r ? JSON.parse(r.value) : []; }catch(e){ STORE.pinLogs = []; }
    try{ const r = await window.storage.get('admins'); STORE.admins = r ? JSON.parse(r.value) : []; }catch(e){ STORE.admins = []; }
    if(STORE.admins.length===0){
      STORE.admins = [{ id: uid(), name: '管理者(初期)', pin: STORE.pin }];
      await saveAdmins();
    }
    render();
  }
  async function saveEmployees(){ await window.storage.set('employees', JSON.stringify(STORE.employees), false); }
  async function saveRecords(){ await window.storage.set('records', JSON.stringify(STORE.records), false); }
  async function savePin(){ await window.storage.set('settings', JSON.stringify({pin: STORE.pin}), false); }
  async function savePinLogs(){ await window.storage.set('pinlogs', JSON.stringify(STORE.pinLogs), false); }
  async function saveAdmins(){ await window.storage.set('admins', JSON.stringify(STORE.admins), false); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n.toString().padStart(2,'0'); }
  function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function fmtDate(d){ return d.getFullYear()+'年'+pad(d.getMonth()+1)+'月'+pad(d.getDate())+'日'; }
  function fmtDateShort(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
  function weekday(d){ return ['日','月','火','水','木','金','土'][d.getDay()]; }

  function lastRecordFor(empId){
    const list = STORE.records.filter(r=>r.employeeId===empId).sort((a,b)=> b.timestamp.localeCompare(a.timestamp));
    return list[0] || null;
  }
  function nextTypeFor(empId){
    const last = lastRecordFor(empId);
    return (!last || last.type==='out') ? 'in' : 'out';
  }
  function isLastToLeave(empId){
    return !STORE.employees.some(e=> e.id!==empId && nextTypeFor(e.id)==='out');
  }

  function showToast(msg){
    let t = document.createElement('div');
    t.className='aa-toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }

  async function punch(empId){
    const emp = STORE.employees.find(e=>e.id===empId);
    if(!emp) return;
    const type = nextTypeFor(empId);
    const now = new Date();
    STORE.records.push({ id: uid(), employeeId: empId, name: emp.name, type, timestamp: now.toISOString() });
    await saveRecords();
    state.modal = 'done';
    state.doneInfo = { name: emp.name, type, time: fmtTime(now) };
    render();
    if(state.doneTimer) clearTimeout(state.doneTimer);
    state.doneTimer = setTimeout(()=>{ state.modal=null; state.doneInfo=null; render(); }, 1500);
  }

  function openPunchModal(empId){ state.selectedEmployee = empId; state.modal='action-select'; render(); }
  function goToPinEntry(){ state.modal='pin-entry'; state.pinAttempt=''; state.pinErr=''; render(); }
  function tryEmpPin(){
    const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
    if(emp && state.pinAttempt === emp.pin){ punch(state.selectedEmployee); }
    else{ state.pinErr='PINが違います'; render(); }
  }
  function goToPinChangeVerify(){ state.modal='pinchange-verify'; state.oldPinAttempt=''; state.pinChangeErr=''; render(); }
  function tryOldPin(){
    const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
    if(emp && state.oldPinAttempt === emp.pin){ state.modal='pinchange-new'; state.newPin1=''; state.newPin2=''; state.pinChangeErr=''; render(); }
    else{ state.pinChangeErr='現在のPINが違います'; render(); }
  }
  async function submitNewPin(){
    if(!state.newPin1 || state.newPin1.length<4){ state.pinChangeErr='PINは4桁以上で入力してください'; render(); return; }
    if(state.newPin1 !== state.newPin2){ state.pinChangeErr='新しいPINが一致しません'; render(); return; }
    await changeEmployeePin(state.selectedEmployee, state.newPin1);
    state.modal = null;
    render();
  }
  function closeModal(){ state.modal=null; state.adminAuthed=false; render(); }

  function openAdmin(){ state.modal='admin-login'; state.pinInput=''; state.err=''; render(); }
  function tryPin(){
    const admin = STORE.admins.find(a=>a.pin === state.pinInput);
    if(admin){ state.adminAuthed=true; state.currentAdminName = admin.name; state.currentAdminId = admin.id; state.modal='admin'; state.adminTab='employees'; state.err=''; }
    else{ state.err='暗証番号が違います'; }
    render();
  }
  async function addAdmin(name, pin){
    if(!name || !name.trim()){ state.adminAddErr='名前を入力してください'; render(); return; }
    if(!pin || pin.length<4){ state.adminAddErr='PINは4桁以上で設定してください'; render(); return; }
    STORE.admins.push({ id: uid(), name: name.trim(), pin: pin.trim() });
    state.adminAddErr='';
    await saveAdmins();
    render();
  }
  async function removeAdmin(id){
    if(STORE.admins.length<=1){ alert('最後の1人は削除できません'); return; }
    STORE.admins = STORE.admins.filter(a=>a.id!==id);
    await saveAdmins();
    render();
  }
  async function changeAdminPin(id, pin){
    const a = STORE.admins.find(a=>a.id===id);
    if(a && pin && pin.trim().length>=4){ a.pin = pin.trim(); await saveAdmins(); render(); showToast('PINを変更しました'); }
    else if(pin!==null){ alert('PINは4桁以上で入力してください'); }
  }

  async function addEmployee(name, pin){
    if(!name.trim()) { state.addErr='氏名を入力してください'; render(); return; }
    if(!pin || pin.length<4){ state.addErr='PINは4桁以上で設定してください'; render(); return; }
    STORE.employees.push({ id: uid(), name: name.trim(), pin: pin.trim() });
    state.addErr='';
    await saveEmployees();
    render();
  }
  async function removeEmployee(id){
    STORE.employees = STORE.employees.filter(e=>e.id!==id);
    await saveEmployees();
    render();
  }
  async function renameEmployee(id, name){
    const e = STORE.employees.find(e=>e.id===id);
    if(e && name.trim()){ e.name = name.trim(); await saveEmployees(); render(); }
  }
  async function changeEmployeePin(id, pin){
    const e = STORE.employees.find(e=>e.id===id);
    if(e && pin && pin.trim().length>=4){ e.pin = pin.trim(); await saveEmployees(); render(); showToast('PINを変更しました'); }
    else if(pin!==null){ alert('PINは4桁以上で入力してください'); }
  }
  function adminChangePinStart(id){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'user';
    input.style.display = 'none';
    input.onchange = (e)=>{
      const file = e.target.files && e.target.files[0];
      if(input.parentNode) document.body.removeChild(input);
      if(!file){ return; }
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const size = 200;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s)/2, sy = (img.height - s)/2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
          finishAdminPinChange(id, dataUrl);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    document.body.appendChild(input);
    input.click();
  }
  async function finishAdminPinChange(id, photoDataUrl){
    const emp = STORE.employees.find(e=>e.id===id);
    if(!emp) return;
    const pin = prompt(emp.name + ' さんの新しいPIN(4桁以上)');
    if(pin===null) return;
    if(pin.trim().length<4){ alert('PINは4桁以上で入力してください'); return; }
    emp.pin = pin.trim();
    await saveEmployees();
    STORE.pinLogs.unshift({ id: uid(), employeeId: id, employeeName: emp.name, adminName: state.currentAdminName || '不明', timestamp: new Date().toISOString(), photo: photoDataUrl });
    await savePinLogs();
    render();
    showToast('PINを変更しました(変更記録を保存しました)');
  }
  async function deletePinLog(id){
    const log = STORE.pinLogs.find(l=>l.id===id);
    if(log){ log.photo = null; log.photoDeletedAt = new Date().toISOString(); }
    await savePinLogs();
    render();
  }
  async function deleteRecord(id){
    STORE.records = STORE.records.filter(r=>r.id!==id);
    await saveRecords();
    render();
  }

  function monthsAvailable(){
    const set = new Set(STORE.records.map(r=> r.timestamp.slice(0,7)));
    const now = new Date();
    set.add(now.getFullYear()+'-'+pad(now.getMonth()+1));
    return Array.from(set).sort().reverse();
  }

  function exportCSV(){
    const month = state.filterMonth || monthsAvailable()[0];
    let rows = STORE.records.filter(r=> r.timestamp.startsWith(month));
    if(state.filterEmp !== 'all') rows = rows.filter(r=>r.employeeId===state.filterEmp);
    rows = rows.sort((a,b)=> a.timestamp.localeCompare(b.timestamp));
    let csv = '\uFEFF氏名,種別,日付,時刻\n';
    rows.forEach(r=>{
      const d = new Date(r.timestamp);
      csv += [r.name, r.type==='in'?'出勤':'退勤', fmtDate(d), fmtTime(d)].join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '勤怠_' + month + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function render(){
    const now = new Date();
    let html = '';
    html += '<div class="aa-header"><div class="aa-brand"><span class="eyebrow">ATTENDANCE</span><h1>勤怠打刻</h1></div>'
      + '<div class="aa-clock"><div class="time">'+fmtTime(now)+'</div><div class="date">'+fmtDate(now)+'（'+weekday(now)+'）</div></div></div>';

    if(STORE.employees.length===0){
      html += '<div class="aa-empty">従業員が登録されていません。<br>右下の設定ボタンから管理者ログインし、従業員を登録してください。</div>';
    } else {
      html += '<div class="aa-grid">';
      STORE.employees.forEach(emp=>{
        const t = nextTypeFor(emp.id);
        const statusLabel = t==='in' ? '未出勤' : '出勤中';
        const statusClass = t==='in' ? 'out' : 'in';
        html += '<div class="aa-tile" data-punch="'+emp.id+'">'
          + '<div class="name">'+escapeHtml(emp.name)+'</div>'
          + '<div class="status '+statusClass+'">'+statusLabel+'</div>'
          + '</div>';
      });
      html += '</div>';
    }

    html += '<div class="aa-fab" id="aa-admin-btn">⚙</div>';

    // modals
    if(state.modal==='action-select'){
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      const type = nextTypeFor(emp.id);
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>'+escapeHtml(emp.name)+' さん</h2>'
        + '<div class="sub">操作を選んでください</div>'
        + '<button class="aa-btn primary '+(type==='out'?'out':'')+'" id="aa-goto-punch">'+(type==='in'?'出勤する':'退勤する')+'</button>'
        + '<button class="aa-btn ghost" id="aa-goto-pinchange">PINの変更</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">キャンセル</button>'
        + '</div></div>';
    }

    if(state.modal==='checklist'){
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>最終退勤者の確認</h2>'
        + '<div class="sub">'+escapeHtml(emp.name)+' さんが本日最後の退勤者です。以下を確認してください。</div>'
        + '<ul style="text-align:left;padding-left:22px;margin:14px 0;line-height:1.9;font-size:14px;">'
        + '<li>会議室の窓の施錠・エアコンの停止</li>'
        + '<li>管理区域の施錠</li>'
        + '<li>事務室内扉の施錠(2か所)</li>'
        + '<li>事務室内書類棚の施錠</li>'
        + '<li>事務室内エアコン(3か所)の停止</li>'
        + '<li>サーキュレーターの停止</li>'
        + '</ul>'
        + '<button class="aa-btn primary" id="aa-checklist-ok">確認しました</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">キャンセル</button>'
        + '</div></div>';
    }

    if(state.modal==='pin-entry'){
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      const type = nextTypeFor(emp.id);
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>'+escapeHtml(emp.name)+' さん</h2>'
        + '<div class="sub">'+(type==='in'?'出勤':'退勤')+'の記録には本人のPINが必要です</div>'
        + '<input class="aa-input" id="aa-emp-pin-input" type="password" inputmode="numeric" placeholder="PIN" value="'+(state.pinAttempt||'')+'">'
        + '<div class="aa-err">'+(state.pinErr||'')+'</div>'
        + '<button class="aa-btn primary '+(type==='out'?'out':'')+'" id="aa-emp-pin-submit">確定</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">キャンセル</button>'
        + '</div></div>';
    }

    if(state.modal==='pinchange-verify'){
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>'+escapeHtml(emp.name)+' さん</h2>'
        + '<div class="sub">現在のPINを入力してください</div>'
        + '<input class="aa-input" id="aa-oldpin-input" type="password" inputmode="numeric" placeholder="現在のPIN" value="'+(state.oldPinAttempt||'')+'">'
        + '<div class="aa-err">'+(state.pinChangeErr||'')+'</div>'
        + '<button class="aa-btn primary" id="aa-oldpin-submit">次へ</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">キャンセル</button>'
        + '</div></div>';
    }

    if(state.modal==='pinchange-new'){
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>新しいPINを設定</h2>'
        + '<div class="sub">'+escapeHtml(emp.name)+' さんの新しいPIN(4桁以上)を入力してください</div>'
        + '<input class="aa-input" id="aa-newpin1-input" type="password" inputmode="numeric" placeholder="新しいPIN" value="'+(state.newPin1||'')+'">'
        + '<input class="aa-input" id="aa-newpin2-input" type="password" inputmode="numeric" placeholder="新しいPIN(確認)" value="'+(state.newPin2||'')+'">'
        + '<div class="aa-err">'+(state.pinChangeErr||'')+'</div>'
        + '<button class="aa-btn primary" id="aa-newpin-submit">変更する</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">キャンセル</button>'
        + '</div></div>';
    }

    if(state.modal==='done'){
      const info = state.doneInfo;
      html += '<div class="aa-overlay"><div class="aa-modal" style="text-align:center;">'
        + '<div style="font-size:46px;color:var(--accent-deep);">✓</div>'
        + '<h2>'+escapeHtml(info.name)+'さん '+(info.type==='in'?'出勤':'退勤')+'</h2>'
        + '<div class="sub">'+info.time+' に記録しました</div>'
        + '</div></div>';
    }

    if(state.modal==='admin-login'){
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal">'
        + '<h2>管理者ログイン</h2><div class="sub">暗証番号を入力してください（初期値: 0000）</div>'
        + '<input class="aa-input" id="aa-pin-input" type="password" inputmode="numeric" placeholder="暗証番号" value="'+(state.pinInput||'')+'">'
        + '<div class="aa-err">'+(state.err||'')+'</div>'
        + '<button class="aa-btn primary" id="aa-pin-submit">ログイン</button>'
        + '<button class="aa-btn ghost" id="aa-cancel">閉じる</button>'
        + '</div></div>';
    }

    if(state.modal==='admin' && state.adminAuthed){
      html += '<div class="aa-overlay" id="aa-overlay"><div class="aa-modal wide">'
        + '<h2>管理者画面</h2>'
        + '<div class="aa-tabs">'
        + tabBtn('employees','従業員管理') + tabBtn('records','勤怠データ') + tabBtn('pinlogs','PIN変更履歴') + tabBtn('settings','設定')
        + '</div>';

      if(state.adminTab==='employees'){
        html += '<div class="aa-row"><input class="aa-input" id="aa-new-emp" placeholder="従業員名"></div>'
          + '<div class="aa-row"><input class="aa-input" id="aa-new-emp-pin" type="text" inputmode="numeric" placeholder="PIN(4桁以上)"><button class="aa-btn small primary" id="aa-add-emp">追加</button></div>'
          + '<div class="aa-err">'+(state.addErr||'')+'</div>';
        html += '<div style="margin-top:16px;">';
        STORE.employees.forEach(e=>{
          html += '<div class="aa-list-item"><span class="lbl">'+escapeHtml(e.name)+'</span>'
            + '<span><span class="aa-del" data-rename="'+e.id+'" style="margin-right:10px;color:var(--accent-deep);">名前変更</span>'
            + '<span class="aa-del" data-pinchange="'+e.id+'" style="margin-right:10px;color:var(--accent-deep);">PIN変更</span>'
            + '<span class="aa-del" data-remove="'+e.id+'">削除</span></span></div>';
        });
        if(STORE.employees.length===0) html += '<div class="sub">従業員がいません</div>';
        html += '</div>';
      }

      if(state.adminTab==='records'){
        const months = monthsAvailable();
        if(!state.filterMonth) state.filterMonth = months[0];
        html += '<div class="aa-filterbar">'
          + '<select id="aa-filter-month">' + months.map(m=>'<option value="'+m+'" '+(m===state.filterMonth?'selected':'')+'>'+m+'</option>').join('') + '</select>'
          + '<select id="aa-filter-emp"><option value="all">全員</option>' + STORE.employees.map(e=>'<option value="'+e.id+'" '+(state.filterEmp===e.id?'selected':'')+'>'+escapeHtml(e.name)+'</option>').join('') + '</select>'
          + '<button class="aa-btn small primary" id="aa-export">CSVエクスポート</button>'
          + '</div>';
        let rows = STORE.records.filter(r=> r.timestamp.startsWith(state.filterMonth));
        if(state.filterEmp!=='all') rows = rows.filter(r=>r.employeeId===state.filterEmp);
        rows = rows.sort((a,b)=> b.timestamp.localeCompare(a.timestamp));
        html += '<table class="aa-table"><thead><tr><th>氏名</th><th>種別</th><th>日付</th><th>時刻</th><th></th></tr></thead><tbody>';
        rows.forEach(r=>{
          const d = new Date(r.timestamp);
          html += '<tr><td>'+escapeHtml(r.name)+'</td><td>'+(r.type==='in'?'出勤':'退勤')+'</td><td>'+fmtDateShort(d)+'('+weekday(d)+')</td><td>'+fmtTime(d)+'</td>'
            + '<td><span class="aa-del" data-delrecord="'+r.id+'">削除</span></td></tr>';
        });
        if(rows.length===0) html += '<tr><td colspan="5" class="sub">データがありません</td></tr>';
        html += '</tbody></table>';
      }

      if(state.adminTab==='pinlogs'){
        html += '<div class="sub">管理者画面からPINを変更した際の記録です(自己変更は含まれません)</div>';
        if(STORE.pinLogs.length===0){
          html += '<div class="sub">記録はまだありません</div>';
        } else {
          STORE.pinLogs.forEach(log=>{
            const d = new Date(log.timestamp);
            html += '<div class="aa-list-item" style="align-items:center;">'
              + (log.photo
                  ? '<img src="'+log.photo+'" style="width:52px;height:52px;border-radius:8px;object-fit:cover;margin-right:12px;">'
                  : '<div style="width:52px;height:52px;border-radius:8px;background:#eee9db;color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;margin-right:12px;">写真<br>削除済</div>')
              + '<span class="lbl" style="flex:1;">'+escapeHtml(log.employeeName)+' さんのPIN変更<br><span class="sub" style="margin:0;">操作者: '+escapeHtml(log.adminName||'不明')+'</span></span>'
              + '<span class="sub" style="margin:0 10px 0 0;">'+fmtDateShort(d)+'('+weekday(d)+') '+fmtTime(d)+'</span>'
              + (log.photo ? '<span class="aa-del" data-delpinlog="'+log.id+'">写真を削除</span>' : '')
              + '</div>';
          });
        }
      }

      if(state.adminTab==='settings'){
        html += '<span class="aa-label">管理者一覧(それぞれ個別のPINを持ちます)</span>';
        STORE.admins.forEach(a=>{
          html += '<div class="aa-list-item"><span class="lbl">'+escapeHtml(a.name)+'</span>'
            + '<span><span class="aa-del" data-adminpinchange="'+a.id+'" style="margin-right:10px;color:var(--accent-deep);">PIN変更</span>'
            + '<span class="aa-del" data-adminremove="'+a.id+'">削除</span></span></div>';
        });
        html += '<div class="aa-row" style="margin-top:14px;"><input class="aa-input" id="aa-new-admin-name" placeholder="管理者名(例:理事長)"></div>'
          + '<div class="aa-row"><input class="aa-input" id="aa-new-admin-pin" type="text" inputmode="numeric" placeholder="PIN(4桁以上)"><button class="aa-btn small primary" id="aa-add-admin">追加</button></div>'
          + '<div class="aa-err">'+(state.adminAddErr||'')+'</div>';
      }

      html += '<button class="aa-btn ghost" id="aa-cancel" style="margin-top:20px;">閉じる</button>';
      html += '</div></div>';
    }

    root.innerHTML = html;
    attachHandlers();
  }

  function tabBtn(key,label){
    return '<div class="aa-tab '+(state.adminTab===key?'active':'')+'" data-tab="'+key+'">'+label+'</div>';
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function attachHandlers(){
    root.querySelectorAll('[data-punch]').forEach(el=> el.onclick = ()=> openPunchModal(el.getAttribute('data-punch')) );
    const adminBtn = document.getElementById('aa-admin-btn');
    if(adminBtn) adminBtn.onclick = openAdmin;
    const cancel = document.getElementById('aa-cancel');
    if(cancel) cancel.onclick = closeModal;
    const gotoPunch = document.getElementById('aa-goto-punch');
    if(gotoPunch) gotoPunch.onclick = ()=>{
      const emp = STORE.employees.find(e=>e.id===state.selectedEmployee);
      const type = nextTypeFor(emp.id);
      if(type==='out' && isLastToLeave(emp.id)){ state.modal='checklist'; render(); }
      else{ goToPinEntry(); }
    };
    const checklistOk = document.getElementById('aa-checklist-ok');
    if(checklistOk) checklistOk.onclick = goToPinEntry;
    const gotoPinchange = document.getElementById('aa-goto-pinchange');
    if(gotoPinchange) gotoPinchange.onclick = goToPinChangeVerify;
    const empPinInput = document.getElementById('aa-emp-pin-input');
    if(empPinInput){ empPinInput.oninput = (e)=> state.pinAttempt = e.target.value; empPinInput.onkeydown = (e)=>{ if(e.key==='Enter') tryEmpPin(); }; }
    const empPinSubmit = document.getElementById('aa-emp-pin-submit');
    if(empPinSubmit) empPinSubmit.onclick = tryEmpPin;
    const oldPinInput = document.getElementById('aa-oldpin-input');
    if(oldPinInput){ oldPinInput.oninput = (e)=> state.oldPinAttempt = e.target.value; oldPinInput.onkeydown = (e)=>{ if(e.key==='Enter') tryOldPin(); }; }
    const oldPinSubmit = document.getElementById('aa-oldpin-submit');
    if(oldPinSubmit) oldPinSubmit.onclick = tryOldPin;
    const newPin1Input = document.getElementById('aa-newpin1-input');
    if(newPin1Input) newPin1Input.oninput = (e)=> state.newPin1 = e.target.value;
    const newPin2Input = document.getElementById('aa-newpin2-input');
    if(newPin2Input){ newPin2Input.oninput = (e)=> state.newPin2 = e.target.value; newPin2Input.onkeydown = (e)=>{ if(e.key==='Enter') submitNewPin(); }; }
    const newPinSubmit = document.getElementById('aa-newpin-submit');
    if(newPinSubmit) newPinSubmit.onclick = submitNewPin;
    const pinInput = document.getElementById('aa-pin-input');
    if(pinInput){ pinInput.oninput = (e)=> state.pinInput = e.target.value; pinInput.onkeydown = (e)=>{ if(e.key==='Enter') tryPin(); }; }
    const pinSubmit = document.getElementById('aa-pin-submit');
    if(pinSubmit) pinSubmit.onclick = tryPin;
    root.querySelectorAll('[data-tab]').forEach(el=> el.onclick = ()=>{ state.adminTab = el.getAttribute('data-tab'); render(); } );
    const addEmpBtn = document.getElementById('aa-add-emp');
    if(addEmpBtn){ addEmpBtn.onclick = ()=>{ const v = document.getElementById('aa-new-emp').value; const p = document.getElementById('aa-new-emp-pin').value; addEmployee(v, p); }; }
    root.querySelectorAll('[data-remove]').forEach(el=> el.onclick = ()=>{ if(confirm('削除しますか？')) removeEmployee(el.getAttribute('data-remove')); } );
    root.querySelectorAll('[data-rename]').forEach(el=> el.onclick = ()=>{ const id=el.getAttribute('data-rename'); const cur = STORE.employees.find(e=>e.id===id); const name = prompt('新しい名前', cur?cur.name:''); if(name) renameEmployee(id,name); } );
    root.querySelectorAll('[data-pinchange]').forEach(el=> el.onclick = ()=>{ const id=el.getAttribute('data-pinchange'); if(confirm('カメラが起動します。撮影後に新しいPINを設定します。よろしいですか？')) adminChangePinStart(id); } );
    root.querySelectorAll('[data-delrecord]').forEach(el=> el.onclick = ()=>{ if(confirm('この記録を削除しますか？')) deleteRecord(el.getAttribute('data-delrecord')); } );
    root.querySelectorAll('[data-delpinlog]').forEach(el=> el.onclick = ()=>{ if(confirm('写真のみ削除します(氏名・日時の記録は残ります)。よろしいですか？')) deletePinLog(el.getAttribute('data-delpinlog')); } );
    const exportBtn = document.getElementById('aa-export');
    if(exportBtn) exportBtn.onclick = exportCSV;
    const filterMonth = document.getElementById('aa-filter-month');
    if(filterMonth) filterMonth.onchange = (e)=>{ state.filterMonth = e.target.value; render(); };
    const filterEmp = document.getElementById('aa-filter-emp');
    if(filterEmp) filterEmp.onchange = (e)=>{ state.filterEmp = e.target.value; render(); };
    const addAdminBtn = document.getElementById('aa-add-admin');
    if(addAdminBtn){ addAdminBtn.onclick = ()=>{ const n = document.getElementById('aa-new-admin-name').value; const p = document.getElementById('aa-new-admin-pin').value; addAdmin(n,p); }; }
    root.querySelectorAll('[data-adminremove]').forEach(el=> el.onclick = ()=>{ if(confirm('削除しますか？')) removeAdmin(el.getAttribute('data-adminremove')); } );
    root.querySelectorAll('[data-adminpinchange]').forEach(el=> el.onclick = ()=>{ const id=el.getAttribute('data-adminpinchange'); const pin = prompt('新しいPIN(4桁以上)'); if(pin!==null) changeAdminPin(id,pin); } );
  }

  loadAll();
  setInterval(()=>{ if(!state.modal) render(); }, 15000);
})();
</script>
